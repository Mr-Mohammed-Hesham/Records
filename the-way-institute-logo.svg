<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800;900&amp;display=swap');
      .w-blue { fill: #0d53ba; }
      .w-text-main {
        font-family: 'Montserrat', 'Arial Black', Arial, sans-serif;
        font-weight: 800;
        font-size: 56px;
        fill: #3e444a;
        letter-spacing: 2px;
      }
      .w-text-sub {
        font-family: 'Montserrat', Arial, sans-serif;
        font-weight: 500;
        font-size: 38px;
        fill: #606770;
        letter-spacing: 1px;
      }
      .w-text-the {
        font-family: 'Montserrat', Arial, sans-serif;
        font-weight: 800;
        font-size: 36px;
        fill: #ffffff;
      }
    </style>
    <clipPath id="swoosh-clip">
      <rect width="1000" height="1000" />
    </clipPath>
  </defs>

  <!-- Clean Canvas -->
  <rect width="1000" height="1000" fill="#ffffff" />

  <!-- LOGO GRAPHIC MARK -->
  <g id="logo-mark" transform="translate(0, 0)">
    
    <!-- Letter W Main Body -->
    <!-- Outer Left Leg -->
    <polygon class="w-blue" points="335,335 422,335 400,650 310,650" />
    
    <!-- Left Inner Diagonal (rising to center peak) -->
    <polygon class="w-blue" points="400,650 495,335 585,335 490,650" />
    
    <!-- Right Inner Diagonal (falling from center peak) -->
    <polygon class="w-blue" points="585,335 675,650 580,650 495,335" />
    
    <!-- Outer Right Leg -->
    <polygon class="w-blue" points="675,650 755,335 845,335 765,650" />

    <!-- White Gap / Contour separating Swoosh from W -->
    <path d="M 210,430 C 220,555 315,625 450,560 C 510,528 585,455 750,250" 
          fill="none" stroke="#ffffff" stroke-width="32" stroke-linecap="round" />

    <!-- Swoosh Arc: Sweeps under left W leg and rises up right -->
    <path class="w-blue" d="
      M 215,430
      C 225,540 310,610 445,550
      C 505,520 580,450 740,250
      L 755,270
      C 590,470 515,540 445,575
      C 295,635 200,550 215,430
      Z
    " />

    <!-- Swoosh Tail Crescent -->
    <path class="w-blue" d="
      M 215,430
      C 218,525 285,595 420,580
      C 305,585 240,515 235,430
      Z
    " />

    <!-- Arrow Head at top right (pointing at ~55 deg) -->
    <polygon class="w-blue" points="705,240 790,195 762,295 738,258" />

    <!-- Circular Badge with 'THE' on the left -->
    <circle cx="265" cy="385" r="50" class="w-blue" />
    <text x="265" y="398" text-anchor="middle" class="w-text-the">THE</text>
  </g>

  <!-- Typography -->
  <text x="500" y="740" text-anchor="middle" class="w-text-main">THE WAY INSTITUTE</text>
  <text x="500" y="792" text-anchor="middle" class="w-text-sub">for languages and computer</text>
</svg>